## Continuous off-disk backup for the SQLite database, so the app can run on Render's
## free web-service tier (no Render Disk) instead of the paid Starter plan it needed
## purely to keep /var/data across redeploys.
##
## How it works: start.sh restores the latest copy from the bucket to DB_PATH on boot if
## it's missing, then `litestream replicate -exec "gunicorn ..."` streams every write to
## the bucket while gunicorn runs as its child, and uploads the last writes on shutdown. The
## app's own code (db.py and friends) is untouched: it still opens the same local file
## with the stdlib sqlite3 module exactly as before. Litestream is a sidecar, not a
## database driver.
##
## Needs four env vars set in the Render dashboard (sync: false in render.yaml, never
## committed): LITESTREAM_BUCKET, LITESTREAM_ENDPOINT, LITESTREAM_ACCESS_KEY_ID,
## LITESTREAM_SECRET_ACCESS_KEY, from a free S3-compatible bucket (Cloudflare R2's free
## tier is 10 GB storage and no egress fee, comfortably above this database's size).
##
## Rollout is two phases, see LITESTREAM.md: phase 1 runs this alongside the existing
## paid disk so replication can be proven correct with zero risk to the live data; only
## phase 2 drops the disk and moves to the free plan.
dbs:
  - path: ${DB_PATH}
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: bridgemd
        endpoint: ${LITESTREAM_ENDPOINT}
        region: auto
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        # Once a minute, not every 10 seconds: the site rewrites the same cache pages many
        # times a minute, and each sync uploads them again. With a weekly snapshot instead of
        # Litestream's default daily one, this was ~200 MB a day of Render bandwidth in
        # October 2026. A clean shutdown still uploads everything (start.sh); only a hard
        # crash can lose up to this much.
        sync-interval: 60s
        # A restore is the newest snapshot plus every change since, so without a disk this
        # sets how long a boot takes. Weekly meant replaying up to a week of changes; every
        # 6 hours costs about 15 MB of bandwidth each and keeps a boot to minutes at most.
        snapshot-interval: 6h
        retention: 168h
