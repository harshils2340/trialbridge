{% extends "public_base.html" %}
{% block title %}Create account · TrialBridge{% endblock %}
{% block body %}
<section class="find-wrap">
  <h1 class="find-title">Create your patient account</h1>
  <p class="find-lead">Use your email and password, then confirm with a 6-digit code.</p>
  <form method="post" class="find-form">
    <label class="find-field"><span>Full name</span>
      <input type="text" name="full_name" required></label>
    <label class="find-field"><span>Email</span>
      <input type="email" name="email" required></label>
    <label class="find-field"><span>Password</span>
      <input type="password" name="password" minlength="8" required></label>
    <button class="btn btn-primary" type="submit">Create account</button>
  </form>
  <p class="cond-note">Already have an account? <a href="{{ url_for('patient_login') }}">Sign in</a></p>
</section>
{% endblock %}
