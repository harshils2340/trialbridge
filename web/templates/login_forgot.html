{% extends "base.html" %}
{% import "_icons.html" as ic %}
{% block title %}Reset your password · BridgeMD{% endblock %}
{% block container %}auth{% endblock %}
{% block auth_body %}
<div class="card">
  <div class="auth-hero"><img class="hero-mark" src="{{ url_for('static', filename='logo.svg') }}" width="46" height="46" alt="BridgeMD"></div>
  <h1>Reset your password</h1>
  <p class="sub">Enter your account email. We'll send you a 6-digit code.</p>
  <form method="post" action="{{ url_for('user_forgot') }}">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required autofocus>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Send code{{ ic.icon('arrow-right') }}</button>
  </form>
  <p class="foot"><a href="{{ url_for('login') }}">Back to sign in</a></p>
</div>
{% endblock %}
