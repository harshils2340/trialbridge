<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trial finder</title>
<style>
  :root{--blue:#1257b0;--blue2:#3f7fce}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:transparent;color:#12122b;padding:26px}
  h3{margin:0 0 4px;font-size:19px;font-weight:800}
  .sub{margin:0 0 18px;color:#6a7690;font-size:14px}
  label{display:block;font-size:13px;font-weight:600;color:#42506a;margin:0 0 6px}
  .field{display:flex;align-items:center;background:#f7f9fc;border:1.5px solid #e6ecf5;
    border-radius:12px;padding:0 14px;height:54px;margin-bottom:14px}
  .field:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,87,176,.14);background:#fff}
  input{border:0;outline:0;background:transparent;width:100%;height:100%;font-size:16px;
    color:#12122b;font-family:inherit}
  button.go{width:100%;border:0;cursor:pointer;height:54px;border-radius:12px;color:#fff;
    font-weight:700;font-size:16px;font-family:inherit;
    background:linear-gradient(180deg,var(--blue2) 0%,var(--blue) 100%);
    box-shadow:0 12px 24px -10px rgba(18,87,176,.6)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chips span{color:#8a93a8;font-size:13px;align-self:center}
  .chips button{border:1px solid #e2e8f2;background:#fff;color:#33405c;border-radius:999px;
    padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .chips button:hover{border-color:var(--blue);color:var(--blue)}
</style>
</head>
<body>
  <form id="f" method="post" action="{{ url_for('find') }}" target="_top">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
    <h3>Try the trial finder</h3>
    <p class="sub">This is the same widget your patients would use.</p>
    <label for="cond">Condition or treatment</label>
    <div class="field"><input id="cond" name="condition"
      placeholder="e.g. type 2 diabetes, migraine, semaglutide"></div>
    <label for="loc">Location</label>
    <div class="field"><input id="loc" name="location" placeholder="City or postal code"></div>
    <button class="go" type="submit">Find trials</button>
    <div class="chips"><span>Popular:</span>
      <button type="button" onclick="pick('Semaglutide')">Semaglutide</button>
      <button type="button" onclick="pick('Migraine')">Migraine</button>
      <button type="button" onclick="pick('Depression')">Depression</button>
    </div>
  </form>
  <script>
    function pick(t){document.getElementById('cond').value=t;document.getElementById('f').submit();}
  </script>
</body>
</html>
