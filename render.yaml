# Render Blueprint — one-click deploy for BridgeMD.
# In Render: New +  ->  Blueprint  ->  pick this repo. It reads this file.
# After the first deploy, set LLM_API_KEY in the service's Environment tab so the
# AI eligibility matching turns on (the demo is much better with it).
services:
  - type: web
    name: bridgemd
    runtime: python
    # Free once the disk is gone (LITESTREAM.md, phase 2): Litestream backs the database
    # up to R2 and start.sh restores it on every boot, so the paid disk is not needed.
    plan: free
    rootDir: web
    healthCheckPath: /healthz
    buildCommand: >-
      pip install -r requirements.txt &&
      (test -x litestream || (curl -sL https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64.tar.gz | tar -xz litestream))
    # 512 MB instance. Each gunicorn worker holds a FULL copy of the interpreter
    # + all in-memory caches, so on a small box 1 worker with many threads uses
    # far less RAM than 2 workers while keeping throughput: the workload is
    # I/O-bound (CT.gov + LLM waits) and the GIL is released on I/O, so threads
    # cover concurrency. --max-requests recycles the worker periodically so
    # per-worker SEO/study/CT.gov caches can't accumulate past the limit under
    # crawler load (the OOM trigger). Bump to --workers 2 only after upgrading
    # the instance memory.
    #
    # start.sh restores the database from R2 when DB_PATH is missing (every boot without
    # a disk; never with one), handing off from the previous instance during a deploy so
    # no write is lost, then runs gunicorn under `litestream replicate -exec` so the stop
    # signal makes Litestream upload the last writes. See LITESTREAM.md.
    #
    # NOTE: this file is not synced to the live `trialbridge` service (it was made
    # in the dashboard, not from this Blueprint). Copy buildCommand/startCommand
    # into the service's Settings when changing them.
    startCommand: bash start.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true      # Render generates a stable random secret
      - key: GOOGLE_CLIENT_ID_PROD
        sync: false              # Google OAuth web client
      - key: GOOGLE_CLIENT_SECRET_PROD
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false              # Meta app ID for Instagram API
      - key: INSTAGRAM_APP_SECRET
        sync: false              # signs Instagram webhook deliveries
      - key: INSTAGRAM_WEBHOOK_VERIFY_TOKEN
        sync: false              # must exactly match the Meta dashboard value
      - key: INSTAGRAM_GRAPH_API_VERSION
        value: "v24.0"
      - key: OAUTH_TOKEN_ENCRYPTION_KEY
        sync: false              # Fernet key for encrypted provider tokens
      - key: BEHIND_PROXY
        value: "1"               # trust Render's HTTPS proxy
      - key: WEB_MAX_MATCH
        value: "6"               # LLM calls per search
      - key: LLM_API_KEY
        sync: false              # Groq key (gsk_...), set in the dashboard (kept secret)
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: DETAIL_SUMMARY_LLM
        value: "1"               # plain-English study summaries from the model
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NO_LOGIN
        value: "0"               # patient side stays gated (real login required)
      - key: SITE_DEMO
        value: "1"               # study-team side runs as a seeded public demo
                                 # (fake claimed trials + applicants + campaigns +
                                 # documents). Set to "0" before onboarding real sites.
      - key: ALERTS_BACKGROUND
        value: "0"
      - key: REMINDERS_BACKGROUND
        value: "0"
      - key: ALERTS_CRON_KEY
        sync: false
      - key: OPS_READINESS_KEY
        sync: false
      # --- Go-live notifications (OFF by default; ~2 min to enable) ------------
      # The full loop works without these (operator copies the /c/<token> link by
      # hand). To turn on real email delivery, set NOTIFY_LIVE=1 and the SMTP_*
      # vars. SITE_NOTIFY_EMAIL is the fallback when CT.gov lists no email
      # (defaults to contact@sonicmedicaltrust.com in the app).
      - key: NOTIFY_LIVE
        value: "1"               # send study-team + operator email on apply
      - key: SITE_NOTIFY_EMAIL
        sync: false              # fallback inbox when a trial has no public email
      - key: PUBLIC_BASE_URL
        sync: false              # https://bridgemd.health (OAuth/webhook links)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RECORDS_PROVIDER
        value: "metriport"
      - key: RECORDS_API_KEY
        sync: false
      - key: RECORDS_WEBHOOK_SECRET
        sync: false
      - key: PAYER_API_URL
        sync: false
      - key: PAYER_API_KEY
        sync: false
      - key: LOGISTICS_API_URL
        sync: false
      - key: LOGISTICS_API_KEY
        sync: false
      - key: SEO_WARM_LIMIT
        value: "80"              # pairs per /seo/warm call (kept under --timeout)
      # The local copy of the database. The filesystem is wiped on every deploy and
      # restart; start.sh restores this file from the Litestream backup (R2 path
      # `bridgemd`) before the app opens it, so the filename itself no longer matters.
      - key: DB_PATH
        value: /opt/render/project/src/web/data/bridgemd.db
      # Litestream's continuous off-disk backup (see litestream.yml). Fill these in the
      # dashboard from a free S3-compatible bucket, e.g. Cloudflare R2 (10 GB free, no
      # egress fee): LITESTREAM_ENDPOINT is the account's R2 endpoint
      # (https://<account-id>.r2.cloudflarestorage.com), LITESTREAM_BUCKET is the bucket
      # name, and the key pair comes from an R2 API token scoped to that bucket only.
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
    # No `disk:` block: a Render Disk needs a paid plan, and the database's durability
    # now comes from the Litestream backup instead.

# --------------------------------------------------------------------------- #
# Weekly SEO warm: refresh which condition/city pages have LOCAL recruiting
# trials so sitemap-cities.xml lists only indexable pages (not the full ~4,200
# grid, most of which self-noindexes -> the "discovered - currently not indexed"
# wall in Search Console). Same pattern as alerts/reminders: the app's
# background loops are OFF and an external scheduler hits an endpoint.
#
# FREE PLAN (recommended): don't add a Render cron service (cron requires a paid
# plan). Instead point any free scheduler (cron-job.org, GitHub Actions) at the
# web service once a week. It just needs to page through /seo/warm, e.g. run
# web/seo_warm.py with PUBLIC_BASE_URL + ALERTS_CRON_KEY set, or a shell loop:
#   off=0; while [ "$off" != "null" ]; do \
#     r=$(curl -s "$PUBLIC_BASE_URL/seo/warm?key=$ALERTS_CRON_KEY&limit=80&offset=$off"); \
#     echo "$r"; off=$(echo "$r" | python -c 'import sys,json;print(json.load(sys.stdin)["next_offset"])'); \
#   done
#
# PAID PLAN: uncomment this Render cron service to run the same warm weekly.
# - type: cron
#   name: bridgemd-seo-warm
#   runtime: python
#   plan: starter
#   rootDir: web
#   schedule: "0 8 * * 1"          # Mondays 08:00 UTC
#   buildCommand: pip install -r requirements.txt
#   startCommand: python seo_warm.py
#   envVars:
#     - key: PUBLIC_BASE_URL
#       sync: false                # e.g. https://app.bridgemd.health
#     - key: ALERTS_CRON_KEY
#       sync: false                # same key the web service uses
#     - key: SEO_WARM_LIMIT
#       value: "80"
