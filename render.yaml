# Render Blueprint — one-click deploy for BridgeMD.
# In Render: New +  ->  Blueprint  ->  pick this repo. It reads this file.
# After the first deploy, set LLM_API_KEY in the service's Environment tab so the
# AI eligibility matching turns on (the demo is much better with it).
services:
  - type: web
    name: bridgemd
    runtime: python
    plan: free
    rootDir: web
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt
    # 512 MB free plan. Base app is ~31 MB/worker, so 2 workers is cheap and
    # keeps recycling seamless (no blip). --max-requests recycles each worker
    # periodically so per-worker SEO/study/CT.gov caches can't accumulate past
    # the limit under crawler load (the OOM trigger). --threads adds concurrency
    # for the I/O-bound LLM/CT.gov waits (GIL is released on I/O).
    startCommand: gunicorn app:app --workers 2 --threads 2 --max-requests 500 --max-requests-jitter 100 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true      # Render generates a stable random secret
      - key: BEHIND_PROXY
        value: "1"               # trust Render's HTTPS proxy
      - key: WEB_MAX_MATCH
        value: "6"               # LLM calls per search
      - key: LLM_API_KEY
        sync: false              # set this yourself in the dashboard (kept secret)
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NO_LOGIN
        value: "0"               # patient side stays gated (real login required)
      - key: SITE_DEMO
        value: "1"               # study-team side runs as a seeded public demo
                                 # (fake claimed trials + applicants + campaigns +
                                 # documents). Set to "0" before onboarding real sites.
      - key: ALERTS_BACKGROUND
        value: "0"
      - key: REMINDERS_BACKGROUND
        value: "0"
      - key: ALERTS_CRON_KEY
        sync: false
      - key: OPS_READINESS_KEY
        sync: false
      # --- Go-live notifications (OFF by default; ~2 min to enable) ------------
      # The full loop works without these (operator copies the /c/<token> link by
      # hand). To turn on real email delivery, set NOTIFY_LIVE=1 and the SMTP_*
      # vars, then SITE_NOTIFY_EMAIL (where new blinded candidates are sent).
      - key: NOTIFY_LIVE
        value: "0"               # flip to "1" to send email
      - key: SITE_NOTIFY_EMAIL
        sync: false              # coordinator inbox for new candidates
      - key: PUBLIC_BASE_URL
        sync: false              # e.g. https://bridgemd.onrender.com (email links)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RECORDS_PROVIDER
        value: "metriport"
      - key: RECORDS_API_KEY
        sync: false
      - key: RECORDS_WEBHOOK_SECRET
        sync: false
      - key: PAYER_API_URL
        sync: false
      - key: PAYER_API_KEY
        sync: false
      - key: LOGISTICS_API_URL
        sync: false
      - key: LOGISTICS_API_KEY
        sync: false
      # For a real pilot, persist the SQLite DB so applications survive redeploys.
      # Render disks need a paid instance (change `plan: free` -> `plan: starter`),
      # then uncomment the DB_PATH env below and the `disk:` block. On the free
      # plan the DB lives on the ephemeral filesystem and resets on each deploy
      # (fine for a demo, not for collecting real applicants).
      # - key: DB_PATH
      #   value: /var/data/bridgemd.db
    # disk:
    #   name: bridgemd-data
    #   mountPath: /var/data
    #   sizeGB: 1
